<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- ربط ملف الـ CSS لتطبيق نفس استايل باقي الصفحات -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- القائمة الرئيسية للربط بين الصفحات الثلاثة -->
    <header>
        <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a href="contact.html" aria-current="page">Contact Us</a></li>
        
      </ul>
    </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>Please fill out the form below to reach out to us:</p>

        <form action="#" method="post">
            
            <!-- 1. Text Input -->
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- 2. Email Input -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <!-- 3. Number Input -->
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" max="100" placeholder="e.g. 20">
            </div>

            <!-- 4. Date Input -->
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>

            <!-- 5. Radio Buttons (استخدام fieldset & legend لإمكانية الوصول) -->
            <fieldset class="form-group">
                <legend>Gender:</legend>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </fieldset>

            <!-- 6. Checkboxes (استخدام fieldset & legend) -->
            <fieldset class="form-group">
                <legend>Interests:</legend>
                <input type="checkbox" id="coding" name="interests" value="coding">
                <label for="coding">Coding</label>
                
                <input type="checkbox" id="sports" name="interests" value="sports">
                <label for="sports">Sports</label>

                <input type="checkbox" id="gaming" name="interests" value="gaming">
                <label for="gaming">Gaming</label>
            </fieldset>

            <!-- 7. Dropdown Menu (Select) -->
            <div class="form-group">
                <label for="subject">Subject / Department:</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>-- Please Select --</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Technical Support</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <!-- 8. Large Text Box (Textarea) -->
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..."></textarea>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
